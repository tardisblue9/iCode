[project]
name = "icode-sandbox"
version = "0.1.0"
description = "File-access sandbox for iCode: kernel-enforced read and write boundaries (macOS Seatbelt, Linux Landlock)"
requires-python = ">=3.14"
license = "Apache-2.0"
# It runs inside the iCode that is installed and imports chrys from there; iCode
# lists this package, not the other way round.
dependencies = []

[project.entry-points."chrys.runtime_guards"]
# iCode loads the module and calls ``install`` at startup when the sandbox is on
# (chrys/foundation/guard.py); ``GUARD`` answers ``icode sandbox …``.
sandbox = "icode_sandbox.guard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icode_sandbox"]
